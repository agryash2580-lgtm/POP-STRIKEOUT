name: Readiness checks
on:
  pull_request:
  push:
    branches: [main, 'devfest/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run package:demo
      - run: npm run qr:demo

  self-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: strikeout-ci-${{ github.run_id }}-${{ github.run_attempt }}
      GIT_COMMIT_SHA: ${{ github.sha }}
      STRIKEOUT_SELF_HOST_SMOKE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - id: fixture
        run: node scripts/check-self-host.mjs prepare
      - run: docker compose config --quiet
      - run: docker compose up --detach --build --wait --wait-timeout 180
      - run: node scripts/check-self-host.mjs verify
      - if: always() && steps.fixture.outcome == 'success'
        run: docker compose down --volumes --remove-orphans
